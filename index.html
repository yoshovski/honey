<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<link rel="icon" id="favicon">
	<link rel="apple-touch-icon" id="apple-touch-icon">
	<link rel="stylesheet" type="text/css" href="css/main.css">
	<script src="js/main.js" type="module"></script>
</head>
<body>
	<div id="background"></div>
	<div id="top-controls">
		<select id="lang-select" aria-label="Language selector">
			<option value="en">🇬🇧 English</option>
			<option value="it">🇮🇹 Italiano</option>
		</select>
		<button id="top-gear" title="Settings">
			<i>settings</i>
		</button>
	</div>
	<div class="main">

		<!-- Home page -->
		<div class="page home" p="home">
			<div class="wrapper">
				<div class="home">
					<img class="appicon">
					<div class="appname"></div>
					<div class="appdesc"></div>
				</div>
				<div class="buttons">
					<div id="theme-switcher">
						<i>&nbsp;</i>
						<div class="text" data-i18n="ui.theme">Theme</div>
					</div>
					<div t="services">
						<i>apps</i>
						<div class="text" data-i18n="ui.services">Services</div>
					</div>
					<div t="more">
						<i>more</i>
						<div class="text" data-i18n="ui.more">More</div>
					</div>
				</div>
			</div>
		</div>

		<!-- App list -->
		<div class="page" p="services">
			<div class="wrapper">
				<div class="header">
					<i>apps</i>
					<div class="text" data-i18n="ui.services">Services</div>
				</div>
				<div class="boxes" id="app-list"></div>
			</div>
		
			<details class="wrapper admin-details" id="admin-wrapper">
					<summary class="header">
						<i>apps</i>
						<div class="text" data-i18n="ui.admin">Admin</div>
						<i class="chev">expand_more</i>
					</summary>
				<div class="boxes" id="admin-list"></div>
			</details>
			</div>
		</div>

		<!-- More -->
		<div class="page" p="more">
			<div class="back"><i></i></div>
			<div class="wrapper">
				<div class="subswitch">
					<div data-i18n="ui.overview_label">Overview</div>
					<div data-i18n="ui.settings_label">Settings</div>
				</div>
				<div class="subpages">

					<!-- Overview -->
					<div>
						<div class="overview">
							<i>rocket_launch</i>
							<div>
								<div class="big"></div>
								<div class="small"></div>
							</div>
						</div>
						<div class="privacy-boxes"></div>
					</div>

					<!-- Settings -->
					<div>
						<div id="no-cookies" data-i18n="ui.warning_no_cookies">WARNING: due to blocked cookies, all settings will be lost after page reload</div>
						<div id="settings"></div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
